<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
        text-align: center;
        background-color: rgb(0, 234, 255);
        font-style: italic;
       }
        h2{
            text-align: center;
        }
        #message{
           
        }
    </style>
</head>
<body>
    <h2>Live Character Counter</h2>
    <textarea name="" id="message" oninput="countCharacters()" rows="5" cols="30"></textarea>
    <h3 id="result">Characters : 0</h3>

</body>
<script>
    function countCharacters(){
        let text=document.getElementById("message");
        let count=text.value.length;
        document.getElementById("result").innerText="Character : "+count;
    }
</script>
</html>
