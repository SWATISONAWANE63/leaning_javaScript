<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body oncontextmenu="return false;">
    <button onclick="hello()">Single Click</button>
     <button ondblclick="hello()">Single Click</button>
      <button oncontextmenu="hello()">Single Click</button>
        <button onmouseenter="hello()">Single Click</button>
          <button ondblclick="hello()">Single Click</button>
          <button onmouseout="hello()">i'm mouseout</button>
          
          
    <script>
        function hello(){
            alert("hello swati");
        }
        
    </script>
</body>
</html>
