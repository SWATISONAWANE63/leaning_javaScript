      <h2>Sorting and Reverse</h2>
    <script>

      
        var b = ["swati", "pratiksha", "shrushti", "arpit", "pratik", "sanika"];
        document.write(b);
        document.write("<br>");
        b.sort();
        document.write(b);
        document.write("<br>");
        b.reverse();
        document.write(b);
 document.write("<br>");
         var c = ["swati", "pratiksha", "shrushti", "arpit", "pratik", "sanika"];
         document.write(c,"<br>");
         c.pop();
         c.pop();
         c.pop();
document.write(c);
c.push("sonu");
c.push("supriya");
c.push("arpit");
document.write(c);





    </script>
    <h2>Shift Unshift</h2>
    <script>
        var d=["swati", "pratiksha", "shrushti", "arpit", "pratik", "sanika"];
        document.write(d,"<br>");
        d.shift();
        d.shift();
        document.write(d);
        document.write("<br>");
        d.unshift("yogesh");
        document.write(d);
    </script>
    <h2>Concat and join</h2>
    <script>
        var a=["swati", "pratiksha", "shrushti"];
        var b=[ "arpit", "pratik", "sanika"];
        var c= a.concat(b);
        var d=["vushika","ajhar","dnyaneshwari"];
        var e=c.concat(d);
        document.write(c);
        document.write("<br>");
        document.write(e);
        document.write("<br>");
        var x=c.join("/");
        document.write(x,"<br>");
    </script>
